(async () => {
  let D;

function main(D) {
const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Oslo"}));
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dayNo = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.parse(D.start + "T00:00:00Z")) / 864e5);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const NO = D.order_old.length, mod = (a, n) => ((a % n) + n) % n;
// rotations: before the first epoch the old 3+6-a-day one of 23 groups; from each epoch's day a rotation of that many groups
const EP = D.epochs.map(e => ({E: Math.round((Date.parse(e.date + "T00:00:00Z") - Date.parse(D.start + "T00:00:00Z")) / 864e5), order: e.order, N: e.order.length}));
const epOf = day => { let r = -1; EP.forEach((e, i) => { if (day >= e.E) r = i; }); return r; };
function ticks() { try { return JSON.parse(localStorage.getItem("fbg2") || "{}"); } catch (e) { return {}; } }
function tick(k, on) { try { const t = ticks(); on ? t[k] = Date.now() : delete t[k]; localStorage.setItem("fbg2", JSON.stringify(t)); } catch (e) {} }
// owner 2026-11-18 "it used to show 3 posts in morning and 3 in evening": every REAL day shows the next groups IN LINE
// (whichever rotation day they belong to) — First 3, then Second 3 six hours after the 3rd post, 6 a day at most
// (owner 2026-11-17: not too many at once). Posting ahead (16 Nov) had made the dated lists run days ahead, so a new
// morning showed one new card next to an old, finished list — the line never does. A group tapped "Still pending" is
// skipped and the next one in line moves up (replaces the "extras"); a missed day just comes back first.
const DAILY_MAX = 6;
function handledToday() {   // cards ticked today by the real clock, oldest first: {d, name, at, pend}
  const t = ticks(), p = pends(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  return Object.entries(t).filter(([k, v]) => /^-?\d+-/.test(k) && typeof v === "number" && v > d0.getTime())
    .map(([k, v]) => { const d = parseInt(k, 10), name = k.slice(String(d).length + 1); return {d, name, at: v, pend: pendOn(p[name], d)}; })
    .sort((a, b) => a.at - b.at);
}
function nextInLine(n, skip) {   // the next n open groups in rotation order, one card per group
  const t = ticks(), out = [], seen = new Set(skip);
  for (let d = Math.max(0, dayNo - 3); d < dayNo + 60 && out.length < n; d++)
    slots(d).forEach((g, i) => {
      if (out.length >= n || g.left || offToday(g, d) || t[d + "-" + g.name] || seen.has(g.name) || waiting(g.name)) return;
      seen.add(g.name); out.push({name: g.name, d, i});
    });
  return out;
}

      else if (dead(g.name)) next = "dropped — leave it";
      else if (pPaused(g.name, dayNo)) next = `paused until ${pends()[g.name].until} (pending)`;
      else {
        const nt = nextTurn(g.name), list = g.code === "en" || g.share ? D.en : (D.files[g.code] || []);
        if (nt && list.length) { const v = list[videoIdx(g, nt[0], nt[1], list.length)];
          next = `<span class="vt" title="${esc(v.title)}">${esc(v.title)}</span><span class="meta">${when(nt[0])}, ${nt[1] < 3 ? "first 3" : "second 3"}${pends()[g.name] ? (stageOf(pends()[g.name]) === 2 ? " · post anyway" : stageOf(pends()[g.name]) === 4 ? " · last check" : " · was pending") : ""}</span>`; }
      }
      return `<tr><td>${i + 1}</td><td><span class="lang ${g.code}">${g.lang}</span> ${esc(g.name)}</td><td>${next}</td></tr>`;
    }).join("") + "</table>";
  document.getElementById("allsum").textContent = `All groups (${D.groups.filter(g => !g.left).length}), next turn first`;
}
allTable();
}
</script></body></html>
