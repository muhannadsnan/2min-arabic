render(); setInterval(() => { if (document.querySelector(".card.locked")) render(); }, 60000);
// the table also shows each group's next turn and the video it will get (owner 2026-11-07)
function allTable() {
  const t = ticks();
  const nextTurn = name => {
    for (let d = dayNo; d < dayNo + 60; d++) {
      const k = slots(d).findIndex(x => x.name === name);
      if (k >= 0 && !t[d + "-" + name]) return [d, k];   // posted early → its next turn
    }
    return null;
  };
  const when = d => { const x = new Date(now); x.setDate(x.getDate() + d - dayNo);
    return d === dayNo ? "today" : d === dayNo + 1 ? "tomorrow" : x.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}); };
  document.getElementById("all").innerHTML = "<table><tr><th>#</th><th>Group</th><th>Next video</th></tr>" +
    // owner 2026-11-15: sorted by the next turn (soonest first) — rotation order made row 1 look like "next" though it was 4 days away
    D.order.filter(gi => !D.groups[gi].left).map(gi => { const nt = nextTurn(D.groups[gi].name); return [gi, nt ? nt[0] * 10 + nt[1] : 1e9]; })
      .sort((a, b) => a[1] - b[1]).map(x => x[0]).map((gi, i) => {
      const g = D.groups[gi]; let next = "—";
      if (g.dropped) next = "dropped";
      else if (g.pause && dateOf(dayNo) < g.pause) next = `paused until ${g.pause}`;
      else if (dead(g.name)) next = "dropped — leave it";
      else if (pPaused(g.name, dayNo)) next = `paused until ${pends()[g.name].until} (pending)`;
      else {
        const nt = nextTurn(g.name), list = g.code === "en" || g.share ? D.en : (D.files[g.code] || []);
        if (nt && list.length) { const v = list[videoIdx(g, nt[0], nt[1], list.length)];
          next = `<span class="vt" title="${esc(v.title)}">${esc(v.title)}</span><span class="meta">${when(nt[0])}, ${nt[1] < 3 ? "first 3" : "second 3"}${pends()[g.name] ? (stageOf(pends()[g.name]) === 2 ? " · post anyway" : stageOf(pends()[g.name]) === 4 ? " · last check" : " · was pending") : ""}</span>`; }
      }
      return `<tr><td>${i + 1}</td><td><span class="lang ${g.code}">${g.lang}</span> ${esc(g.name)}</td><td>${next}</td></tr>`;
    }).join("") + "</table>";
  document.getElementById("allsum").textContent = `All groups (${D.groups.filter(g => !g.left).length}), next turn first`;
}
allTable();
}
</script></body></html>
