      return `<tr><td>${i + 1}</td><td><span class="lang ${g.code}">${g.lang}</span> ${esc(g.name)}</td><td>${next}</td></tr>`;
    }).join("") + "</table>";
  document.getElementById("allsum").textContent = `All groups (${D.groups.filter(g => !g.left).length}), in rotation order`;
}
allTable();
}
</script></body></html>
