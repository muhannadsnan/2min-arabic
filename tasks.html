function main(D) {
const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Oslo"}));
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dayNo = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.parse(D.start + "T00:00:00Z")) / 864e5);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const NO = D.order_old.length, mod = (a, n) => ((a % n) + n) % n;
// rotations: before the first epoch the old 3+6-a-day one of 23 groups; from each epoch's day a rotation of that many groups
const EP = D.epochs.map(e => ({E: Math.round((Date.parse(e.date + "T00:00:00Z") - Date.parse(D.start + "T00:00:00Z")) / 864e5), order: e.order, N: e.order.length}));
const epOf = day => { let r = -1; EP.forEach((e, i) => { if (day >= e.E) r = i; }); return r; };
function ticks() { try { return JSON.parse(localStorage.getItem("fbg2") || "{}"); } catch (e) { return {}; } }
