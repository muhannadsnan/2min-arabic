const span2 = ms => { const m = Math.max(1, Math.round(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} h ${m % 60} min` : `${m} min`; };
// extras (owner 2026-11-09: "show more groups if the list contains pending ones … so we don't count them"): for every
// card skipped today (pending or no posting allowed) one more group: the next one in line, its own later turn brought
// forward — ticking it ticks that later card (same key), so it is never asked twice and gets that turn's video.
function xpicks() { try { return JSON.parse(localStorage.getItem("fbgx") || "{}"); } catch (e) { return {}; } }
function extras(box, day, from, to) {
  const t = ticks(), p = pends(), today = new Set(slots(day).map(g => g.name)), X = xpicks(), mine = X[day] || [];
  const need = slots(day).slice(from, to).filter(g => !g.left && (offToday(g, day) || dead(g.name) || pendOn(p[g.name], day))).length;
  const skipped = x => pendOn(p[x.n], x.d);   // an extra marked Still pending → it needs a replacement too
  const used = new Set(Object.values(X).flat().map(x => x.n)), out = [], ok = () => out.filter(x => !skipped(x)).length;
  mine.filter(x => x.s === from).forEach(x => out.push(x));                                          // kept picks stay put
  // candidates: first the groups we never posted to (joined 8 Nov — nothing can be pending there), then the rest in line
  const cand = [], sent = Object.keys(sentLog());
  for (let d = day + 1; d < day + 30; d++) slots(d).forEach((g, k) => {
    if (g.dropped || paused(g, d) || p[g.name] || today.has(g.name) || used.has(g.name) || t[d + "-" + g.name] || cand.some(c => c.n === g.name)) return;
    cand.push({n: g.name, d, k, s: from, fresh: g.fresh && !sent.some(x => x.endsWith("-" + g.name))});   // posted once → may be pending
  });
  cand.sort((a, b) => (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0));   // stable: keeps the line order inside each group
  for (const c of cand) { if (ok() >= need) break; out.push(c); }
  if (!out.length) return;
  X[day] = mine.filter(x => x.s !== from).concat(out);
  try { localStorage.setItem("fbgx", JSON.stringify(Object.fromEntries(Object.entries(X).filter(([k]) => +k >= day - 1)))); } catch (e) {}
  box.insertAdjacentHTML("beforeend", `<p class="meta" style="margin:8px 2px 6px">Extra — instead of the skipped one${out.length > 1 ? "s" : ""} (its own later turn, brought forward):</p>`);
  out.forEach(x => { const g = D.groups.find(y => y.name === x.n); if (g) box.appendChild(card(Object.assign({}, g), x.k, x.d, 0)); });
}
function fill(id, day, lockEvening) {
  const box = document.getElementById(id); box.innerHTML = ""; let en = 0;
  const opens = eveningOpensAt(day), t = ticks();
  slots(day).forEach((g, i) => {
    if (lockEvening && i === 3) extras(box, day, 0, 3);   // after the morning 3, before the Evening heading
    if (per(day) > 3 && i % 3 === 0) box.insertAdjacentHTML("beforeend", `<h3>${i ? "Evening" : "Morning"}</h3>`);
    const isEn = g.code === "en", idx = isEn ? en++ : 0;
    if (g.left) return;   // owner 2026-11-10: groups he has left disappear from the page (their slot still gets an extra)
    if (offToday(g, day)) { box.insertAdjacentHTML("beforeend", `<div class="card done"><span class="g">${esc(g.name)}</span> <span class="meta">— skipped: ${g.dropped ? "no posting allowed" : paused(g, day) ? "paused until " + g.pause + " (declines new accounts)" : pPaused(g.name, day) ? "paused until " + pends()[g.name].until + " (posts stay pending)" : "dropped (pending twice, 12 weeks) — leave it"}</span></div>`); return; }
    if (lockEvening && i >= 3 && !t[day + "-" + g.name] && (opens === null || Date.now() < opens)) {
      if (!box.querySelector(".locked")) box.insertAdjacentHTML("beforeend", `<div class="card locked"><p class="none">${opens === null
        ? "Opens 6 hours after you tick the 3rd morning group."
        : `Opens in ${span2(opens - Date.now())} (at ${new Date(opens).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"})}) — 6 hours after your morning posts.`}</p></div>`);
      return;
    }
    box.appendChild(card(Object.assign({}, g), i, day, idx));
  });
  if (lockEvening && !box.querySelector(".locked")) extras(box, day, 3, 6);
}
// the YouTube Post on carousel days (Wed + Sun; owner 2026-11-04): the same pictures + text as the Instagram carousel,
// which Instagram and the Facebook Page get automatically at 19:00. Yesterday's stays until it's ticked.
function ytCard() {
  const today = ymd(now), yd = new Date(now); yd.setDate(yd.getDate() - 1);
  const p = (D.yt || []).find(p => p.date === today) || (D.yt || []).find(p => p.date === ymd(yd) && !ticks()["yt-" + p.date]);
  if (!p) return null;
  const key = "yt-" + p.date, done = !!ticks()[key], wrap = document.createElement("div");
  wrap.innerHTML = `<h3>Post${p.date === today ? "" : " (yesterday's)"}</h3><div class="card${done ? " done" : ""}"><div class="top">
    <span class="g">${esc(p.title)}</span><span class="right"><label class="tick"><input type="checkbox" ${done ? "checked" : ""}> Posted</label></span></div>
    <div class="btns"><a class="btn" href="https://www.youtube.com/@2MinArabic/posts" target="_blank" rel="noopener">Open YouTube Posts</a>
    <span class="file">Pictures: <b>Downloads → yt-posts → ${esc(p.folder)}</b> (all ${p.n})</span></div>
    <div class="box"><pre>${esc(p.text)}</pre><button class="copy">Copy text</button></div></div>`;
  const b = wrap.querySelector("button.copy");
  b.onclick = () => navigator.clipboard.writeText(p.text).then(() => { b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy text", 1500); });
  wrap.querySelector("input").onchange = e => { tick(key, e.target.checked); wrap.querySelector(".card").classList.toggle("done", e.target.checked); };
  return wrap;
}
// Facebook to-dos (owner 2026-11-08: "remind me of those to remove"): dropped groups to leave (tick "Left"), groups to test
function todoCard() {
  let left = {}; try { left = JSON.parse(localStorage.getItem("fbgl") || "{}"); } catch (e) {}
  const leave = D.groups.filter(g => ((g.dropped && !g.left && !g.todo) || (!g.dropped && dead(g.name))) && !left[g.name]), test = D.groups.filter(g => g.todo);
  const box = document.getElementById("todo"); box.innerHTML = "";
  if (!leave.length && !test.length) return;
  box.innerHTML = `<h3>Facebook to-dos</h3><div class="card">` +
    (leave.length ? `<p class="meta" style="margin:0 0 6px">Leave these groups (no posting allowed, or posts pending through both pauses — never join them again; tell Claude too) — open → Joined ▾ → Leave group:</p>` +
      leave.map(g => `<label class="tick" style="margin:4px 0"><input type="checkbox" data-n="${esc(g.name)}"> ${esc(g.name)}</label>`).join("") : "") +
    (test.length ? `<p class="meta" style="margin:${leave.length ? 12 : 0}px 0 6px">To check, then tell Claude:</p>` +
      test.map(g => `<p style="margin:4px 0"><b>${esc(g.name)}</b> — ${esc(g.todo)}</p>`).join("") : "") + `</div>`;
  box.querySelectorAll("input").forEach(i => i.onchange = () => { try { left[i.dataset.n] = Date.now(); localStorage.setItem("fbgl", JSON.stringify(left)); } catch (e) {} todoCard(); });
}
// YouTube section: the Post on carousel days, otherwise a quiet line with the next one
function ytSection() {
  const box = document.getElementById("yt"); box.innerHTML = ""; const y = ytCard();
  if (y) { box.appendChild(y); return; }
  const nx = (D.yt || []).filter(p => p.date > ymd(now)).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  box.innerHTML = `<p class="none">Nothing to do today.${nx ? " Next YouTube Post: " + new Date(nx.date + "T12:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}) + "." : ""}</p>`;
}
// Instagram section (owner 2026-11-10): everything posts by itself; a card only when a queue Claude fills runs low
function igSection() {
  const box = document.getElementById("ig"), q = D.q || {}, t = q.trial, c = q.carousel; box.innerHTML = "";
  const day = d => new Date(d + "T12:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});
  const low = [];
  if (t && t.left <= 5) low.push(`<p style="margin:4px 0"><b>Language trials: ${t.left ? t.left + " left — the last one " + day(t.last) : "the queue is empty"}.</b> Tell Claude <b>"fill the trials"</b>.</p>`);
  if (c && c.left <= 2) low.push(`<p style="margin:4px 0"><b>Carousels: ${c.left ? c.left + " left" : "the queue is empty"}.</b> Tell Claude <b>"make the next carousels"</b>.</p>`);
  if (low.length) box.innerHTML = `<div class="card">${low.join("")}</div>`;
  else box.innerHTML = `<p class="none">Nothing to do — posting by itself.${t ? " Trials: " + t.left + " queued (to " + day(t.last) + ")." : ""}${c ? " Carousels: " + c.left + " queued." : ""}</p>`;
}
function render() { todoCard(); if (document.getElementById("all").innerHTML) allTable(); fill("today", dayNo, true); ahead(); ytSection(); igSection(); }
// owner 2026-11-16 "just give me the new bunch": when every card of today is done, tomorrow's groups appear below to post
// early — ticks use tomorrow's key, so tomorrow shows them as done (the 6-hour gap still applies to their evening 3)
function ahead() {
  const w = document.getElementById("aheadwrap"), todayOpen = document.querySelector("#today .card:not(.done)");
  w.hidden = !!todayOpen; if (todayOpen) return;
  fill("ahead", dayNo + 1, true);
}
// footer: last update + countdown to the next one (site-latest.yml runs hourly at :25, 05–20 UTC)
const UPD = Array.from({length: 16}, (_, k) => 5 + k).map(h => h);  // checks at :05 (laptop) and :25 (GitHub)
function footer() {
  const f = document.getElementById("foot"), built = new Date(f.dataset.built), t = new Date();
  let next = null;
  for (let d = 0; d < 2 && !next; d++) for (const h of UPD) {
    const c = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate() + d, h, 25));
    if (c > t) { next = c; break; }
  }
  // owner 2026-11-04: three short lines — "updated: 1:56h ago (4.nov)" / "next hourly check in 22min" / "auto-refreshing page"
  const span = ms => { const m = Math.round(Math.abs(ms) / 60000), h = Math.floor(m / 60);
    return h ? `${h}:${String(m % 60).padStart(2, "0")}h` : `${m}min`; };
  const at = d => d.toLocaleDateString("en-GB", {timeZone: "Europe/Oslo", day: "numeric"}) + "."
    + d.toLocaleDateString("en-GB", {timeZone: "Europe/Oslo", month: "short"}).toLowerCase();
  f.innerHTML = `updated: ${span(t - built)} ago (${at(built)})<br>next hourly check in ${span(next - t)}<br>auto-refreshing page`;
}
footer(); setInterval(footer, 60000);
// self-refresh (owner 2026-11-03): every 5 min, only while the page is on screen — the content changes at most hourly
// and GitHub Pages caches it 10 min, so faster gains nothing. A tiny conditional request (304 when unchanged); the
// page reloads only when the content fingerprint changed or the Oslo day turned over. Ticks live in localStorage.
let lastCheck = Date.now();
async function refresh() {
  if (document.visibilityState !== "visible" || Date.now() - lastCheck < 60000) return;
  lastCheck = Date.now();
  const day = ymd(new Date(new Date().toLocaleString("en-US", {timeZone: "Europe/Oslo"})));
  if (day !== ymd(now)) return location.reload();
  try {
    const r = await fetch(location.pathname, {cache: "no-cache"});
    const m = r.ok && (await r.text()).match(/data-fp="([^"]*)"/);
    if (m && m[1] !== document.getElementById("foot").dataset.fp) location.reload();
  } catch (e) {}   // offline: try again next time
}
setInterval(refresh, 5 * 60000);
document.addEventListener("visibilitychange", refresh);   // back to the tab → check at once
document.getElementById("date").textContent = now.toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long"});
render(); setInterval(() => { if (document.querySelector(".card.locked")) render(); }, 60000); fill("yesterday", dayNo - 1, false);
// the table also shows each group's next turn and the video it will get (owner 2026-11-07)
function allTable() {
  const t = ticks();
  const nextTurn = name => {
    for (let d = dayNo; d < dayNo + 60; d++) {
      const k = slots(d).findIndex(x => x.name === name);
      if (k >= 0 && !t[d + "-" + name]) return [d, k];   // posted early → its next turn
    }
    return null;
  };
  const when = d => { const x = new Date(now); x.setDate(x.getDate() + d - dayNo);
    return d === dayNo ? "today" : d === dayNo + 1 ? "tomorrow" : x.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"}); };
  document.getElementById("all").innerHTML = "<table><tr><th>#</th><th>Group</th><th>Next video</th></tr>" +
    // owner 2026-11-15: sorted by the next turn (soonest first) — rotation order made row 1 look like "next" though it was 4 days away
    D.order.filter(gi => !D.groups[gi].left).map(gi => { const nt = nextTurn(D.groups[gi].name); return [gi, nt ? nt[0] * 10 + nt[1] : 1e9]; })
      .sort((a, b) => a[1] - b[1]).map(x => x[0]).map((gi, i) => {
      const g = D.groups[gi]; let next = "—";
      if (g.dropped) next = "dropped";
      else if (g.pause && dateOf(dayNo) < g.pause) next = `paused until ${g.pause}`;
      else if (dead(g.name)) next = "dropped — leave it";
      else if (pPaused(g.name, dayNo)) next = `paused until ${pends()[g.name].until} (pending)`;
      else {
        const nt = nextTurn(g.name), list = g.code === "en" || g.share ? D.en : (D.files[g.code] || []);
        if (nt && list.length) { const v = list[videoIdx(g, nt[0], nt[1], list.length)];
          next = `<span class="vt" title="${esc(v.title)}">${esc(v.title)}</span><span class="meta">${when(nt[0])}, ${nt[1] < 3 ? "morning" : "evening"}${pends()[g.name] ? (stageOf(pends()[g.name]) === 2 ? " · post anyway" : stageOf(pends()[g.name]) === 4 ? " · last check" : " · was pending") : ""}</span>`; }
      }
      return `<tr><td>${i + 1}</td><td><span class="lang ${g.code}">${g.lang}</span> ${esc(g.name)}</td><td>${next}</td></tr>`;
    }).join("") + "</table>";
  document.getElementById("allsum").textContent = `All groups (${D.groups.filter(g => !g.left).length}), next turn first`;
}
allTable();
}
