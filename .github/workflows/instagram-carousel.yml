# Instagram carousel twice a week (owner, 2026-10-30): Wed + Sun 19:00 Oslo (18:00 UTC in winter), from the encrypted
# `ig-carousel` release (tools/ig_carousel_add.py). Once a day (marker asset). Timing isn't
# critical, so GitHub's own schedule is enough here.
name: Instagram carousel (Wed + Sun)
on:
  schedule:
    - cron: "0,30 18,19,20 * * 0,3"   # many chances; once a day via the done-<date> marker
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Instagram checks the slides, nothing is published)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: instagram-carousel
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Post the next carousel
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_QUEUE_KEY: ${{ secrets.IG_QUEUE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/ig_cloud_post.py --carousel --dry-run --force
          else
            python3 tools/ig_cloud_post.py --carousel
          fi
