# Daily Instagram Reel at 15:00 Oslo, posted from GitHub's servers — the laptop can be off (owner, 2026-10-15).
# MAIN trigger since 2026-10-18: cron-job.org job "2min Instagram 15:00" (owner's account, Europe/Oslo) POSTs a
# workflow_dispatch at 15:00 sharp with dry_run=false (fine-grained token 2min-ig-cron: Actions write on this repo
# only, expires 2027-10-17). The schedule below and the laptop nudge are backups.
# Every 15 min 13–15 UTC (summer + winter time) + a laptop nudge at 15:00 (2min-ig-trigger timer → workflow_dispatch,
# which starts at once); tools/ig_cloud_post.py waits for 15:00 Oslo and never posts twice a day.
name: Instagram daily Reel
on:
  schedule:   # GitHub starts scheduled runs late or skips them under load (17 Oct: 3 h late) → many chances;
    - cron: "7,22,37,52 13,14,15 * * *"   # the script posts only after 15:00 Oslo and only once a day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Instagram processes the video, nothing is published)"
        type: boolean
        default: true
permissions:
  contents: write   # the ig-temp link and the ig-queue release of this repo
concurrency: instagram-daily
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Post the next Reel
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_QUEUE_KEY: ${{ secrets.IG_QUEUE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/ig_cloud_post.py --dry-run --force
          else
            python3 tools/ig_cloud_post.py
          fi
