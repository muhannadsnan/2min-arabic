# Daily dubbed Trial Reel (owner, 2026-10-19): one language a day from the encrypted `ig-trial` release, posted as an
# Instagram Trial Reel (non-followers only). Runs after the 15:00 main Reel; once a day (marker asset). Timing isn't
# critical, so GitHub's own schedule is enough here.
name: Instagram daily Trial Reel
on:
  schedule:   # two a day while x03's versions run (owner 2026-10-19), then back to one (remove the morning line)
    - cron: "37 9 * * *"
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Instagram processes the video, nothing is published)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: instagram-trial
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Post the next Trial Reel
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_QUEUE_KEY: ${{ secrets.IG_QUEUE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/ig_cloud_post.py --trial --dry-run --force
          else
            python3 tools/ig_cloud_post.py --trial
          fi
