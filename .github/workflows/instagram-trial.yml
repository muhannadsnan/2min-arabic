# Daily dubbed Trial Reel (owner, 2026-10-19): one language a day from the encrypted `ig-trial` release, posted as an
# Instagram Trial Reel (non-followers only). Runs after the 15:00 main Reel; once a day (marker asset). GitHub's own
# schedule runs late or not at all at busy times → many start times, the first one posts. Manual run: -f dry_run=false.
name: Instagram daily Trial Reel
on:
  schedule:   # one a day (two a day ran only for x03's versions, 19–27 Oct)
    - cron: "7,37 16,17,18,19 * * *"   # many chances (31 Oct: the 17:37 run never started); once a day via the done-<date>-pm marker
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Instagram processes the video, nothing is published)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: instagram-trial
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Post the next Trial Reel
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_QUEUE_KEY: ${{ secrets.IG_QUEUE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 tools/ig_cloud_post.py --trial --dry-run --force
          else
            python3 tools/ig_cloud_post.py --trial
          fi
